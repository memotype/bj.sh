name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build generated scripts
        run: make -B all

      - name: Run verification
        run: make verify

      - name: Check for generated diffs
        run: git diff --exit-code
